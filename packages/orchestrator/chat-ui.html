<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orchestrator Chat - SSE 对话界面</title>
    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- 代码高亮库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: calc(100vh - 40px);
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 24px;
        text-align: center;
      }

      .header h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .header p {
        opacity: 0.9;
        font-size: 14px;
      }

      .config-panel {
        padding: 20px;
        background: #f8f9fa;
        border-bottom: 1px solid #e9ecef;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        align-items: center;
      }

      .config-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .config-item label {
        font-size: 14px;
        font-weight: 500;
        color: #495057;
      }

      .config-item select,
      .config-item input[type='checkbox'] {
        padding: 6px 12px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 14px;
      }

      .config-item select {
        cursor: pointer;
      }

      .chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #ffffff;
      }

      .message {
        margin-bottom: 16px;
        animation: fadeIn 0.3s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message-user {
        text-align: right;
      }

      .message-bubble {
        display: inline-block;
        padding: 12px 16px;
        border-radius: 18px;
        max-width: 70%;
        word-wrap: break-word;
        line-height: 1.6;
      }

      .message-user .message-bubble {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .message-ai .message-bubble {
        background: #f1f3f5;
        color: #212529;
      }

      /* Markdown 样式 */
      .message-bubble h1,
      .message-bubble h2,
      .message-bubble h3,
      .message-bubble h4,
      .message-bubble h5,
      .message-bubble h6 {
        margin-top: 1em;
        margin-bottom: 0.5em;
        font-weight: 600;
        line-height: 1.25;
      }

      .message-bubble h1 {
        font-size: 1.5em;
        border-bottom: 1px solid #eaecef;
        padding-bottom: 0.3em;
      }

      .message-bubble h2 {
        font-size: 1.3em;
        border-bottom: 1px solid #eaecef;
        padding-bottom: 0.3em;
      }

      .message-bubble h3 {
        font-size: 1.1em;
      }

      .message-bubble p {
        margin: 0.5em 0;
      }

      .message-bubble ul,
      .message-bubble ol {
        margin: 0.5em 0;
        padding-left: 2em;
      }

      .message-bubble li {
        margin: 0.25em 0;
      }

      .message-bubble blockquote {
        margin: 0.5em 0;
        padding: 0 1em;
        color: #6a737d;
        border-left: 0.25em solid #dfe2e5;
      }

      .message-bubble code {
        padding: 0.2em 0.4em;
        margin: 0;
        font-size: 85%;
        background-color: rgba(27, 31, 35, 0.05);
        border-radius: 3px;
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      }

      .message-bubble pre {
        padding: 16px;
        overflow: auto;
        font-size: 85%;
        line-height: 1.45;
        background-color: #1e1e1e;
        border-radius: 6px;
        margin: 0.5em 0;
      }

      .message-bubble pre code {
        display: inline;
        max-width: auto;
        padding: 0;
        margin: 0;
        overflow: visible;
        line-height: inherit;
        word-wrap: normal;
        background-color: transparent;
        border: 0;
        color: #d4d4d4;
      }

      .message-bubble table {
        border-spacing: 0;
        border-collapse: collapse;
        margin: 0.5em 0;
        width: 100%;
      }

      .message-bubble table th,
      .message-bubble table td {
        padding: 6px 13px;
        border: 1px solid #dfe2e5;
      }

      .message-bubble table th {
        font-weight: 600;
        background-color: #f6f8fa;
      }

      .message-bubble table tr {
        background-color: #fff;
        border-top: 1px solid #c6cbd1;
      }

      .message-bubble table tr:nth-child(2n) {
        background-color: #f6f8fa;
      }

      .message-bubble a {
        color: #0366d6;
        text-decoration: none;
      }

      .message-bubble a:hover {
        text-decoration: underline;
      }

      .message-bubble hr {
        height: 0.25em;
        padding: 0;
        margin: 1em 0;
        background-color: #e1e4e8;
        border: 0;
      }

      .message-bubble img {
        max-width: 100%;
        height: auto;
        border-radius: 4px;
        margin: 0.5em 0;
      }

      /* 用户消息中的 Markdown 样式（白色文字） */
      .message-user .message-bubble h1,
      .message-user .message-bubble h2,
      .message-user .message-bubble h3,
      .message-user .message-bubble h4,
      .message-user .message-bubble h5,
      .message-user .message-bubble h6 {
        color: white;
        border-bottom-color: rgba(255, 255, 255, 0.3);
      }

      .message-user .message-bubble blockquote {
        color: rgba(255, 255, 255, 0.8);
        border-left-color: rgba(255, 255, 255, 0.3);
      }

      .message-user .message-bubble code {
        background-color: rgba(0, 0, 0, 0.2);
        color: white;
      }

      .message-user .message-bubble pre {
        background-color: rgba(0, 0, 0, 0.3);
      }

      .message-user .message-bubble pre code {
        color: white;
      }

      .message-user .message-bubble a {
        color: #a8d8ff;
      }

      .message-user .message-bubble table th,
      .message-user .message-bubble table td {
        border-color: rgba(255, 255, 255, 0.3);
      }

      .message-user .message-bubble table th {
        background-color: rgba(0, 0, 0, 0.2);
      }

      .message-user .message-bubble table tr {
        border-top-color: rgba(255, 255, 255, 0.2);
      }

      .message-user .message-bubble table tr:nth-child(2n) {
        background-color: rgba(0, 0, 0, 0.1);
      }

      .message-user .message-bubble hr {
        background-color: rgba(255, 255, 255, 0.3);
      }

      .message-thinking {
        color: #6c757d;
        font-style: italic;
        font-size: 14px;
        padding: 8px 12px;
        background: #f8f9fa;
        border-left: 3px solid #6c757d;
        border-radius: 4px;
        margin-bottom: 8px;
      }

      .message-plan {
        background: #e7f5ff;
        border: 1px solid #74c0fc;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 8px;
      }

      .message-plan h4 {
        color: #1971c2;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .message-plan ul {
        margin-left: 20px;
        color: #495057;
      }

      .message-plan li {
        margin-bottom: 4px;
      }

      .message-worker {
        background: #fff3cd;
        border: 1px solid #ffc107;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .message-worker strong {
        color: #856404;
      }

      .message-synthesis {
        background: #d1e7dd;
        border: 1px solid #75b798;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 8px;
      }

      .message-error {
        background: #f8d7da;
        border: 1px solid #f5c2c7;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 8px;
        color: #842029;
      }

      .input-area {
        padding: 20px;
        background: #f8f9fa;
        border-top: 1px solid #e9ecef;
      }

      .input-wrapper {
        display: flex;
        gap: 12px;
      }

      .input-wrapper input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #ced4da;
        border-radius: 24px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.3s;
      }

      .input-wrapper input:focus {
        border-color: #667eea;
      }

      .input-wrapper button {
        padding: 12px 32px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 24px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .input-wrapper button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .input-wrapper button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        padding: 12px 20px;
        background: #e7f5ff;
        border-bottom: 1px solid #e9ecef;
        font-size: 14px;
        color: #1971c2;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status.connected::before {
        content: '●';
        color: #51cf66;
        font-size: 12px;
      }

      .status.disconnected::before {
        content: '●';
        color: #ff6b6b;
        font-size: 12px;
      }

      .status.loading::before {
        content: '⟳';
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .session-info {
        font-size: 12px;
        color: #6c757d;
        margin-top: 8px;
      }

      .typing-indicator {
        display: inline-block;
        padding: 8px 12px;
        background: #f1f3f5;
        border-radius: 12px;
        color: #6c757d;
        font-size: 14px;
      }

      .typing-indicator::after {
        content: '...';
        animation: dots 1.5s steps(4, end) infinite;
      }

      @keyframes dots {
        0%,
        20% {
          content: '.';
        }
        40% {
          content: '..';
        }
        60%,
        100% {
          content: '...';
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🤖 Orchestrator Chat</h1>
        <p>基于 SSE 的实时对话界面</p>
      </div>

      <div class="status disconnected" id="status">未连接 - 请确保服务器运行在 http://localhost:3000</div>

      <div class="config-panel">
        <div class="config-item">
          <label>模式:</label>
          <select id="mode">
            <option value="auto">自动</option>
            <option value="orchestrator">编排器</option>
            <option value="simple">简单</option>
          </select>
        </div>
        <div class="config-item">
          <label>
            <input type="checkbox" id="thinkingEnabled" />
            显示思考过程
          </label>
        </div>
        <div class="config-item">
          <label>
            <input type="checkbox" id="mcpEnabled" checked />
            启用 MCP
          </label>
        </div>
        <div class="config-item">
          <label>服务器地址:</label>
          <input
            type="text"
            id="serverUrl"
            value="http://localhost:3000"
            style="width: 200px; padding: 6px 12px; border: 1px solid #ced4da; border-radius: 6px"
          />
        </div>
      </div>

      <div class="chat-container">
        <div class="messages" id="messages"></div>
        <div class="input-area">
          <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="输入你的消息..." autocomplete="off" />
            <button id="sendButton" onclick="sendMessage()">发送</button>
          </div>
          <div class="session-info" id="sessionInfo"></div>
        </div>
      </div>
    </div>

    <script>
      let currentSessionId = null
      let currentEventSource = null
      let isStreaming = false

      // 检查服务器连接
      async function checkConnection() {
        const serverUrl = document.getElementById('serverUrl').value
        const statusEl = document.getElementById('status')

        try {
          const response = await fetch(`${serverUrl}/health`)
          if (response.ok) {
            statusEl.textContent = '已连接到服务器'
            statusEl.className = 'status connected'
            return true
          } else {
            throw new Error('服务器响应异常')
          }
        } catch (error) {
          statusEl.textContent = `连接失败: ${error.message}`
          statusEl.className = 'status disconnected'
          return false
        }
      }

      // 初始化时检查连接
      checkConnection()
      setInterval(checkConnection, 10000) // 每10秒检查一次

      // 添加消息到界面
      function addMessage(content, type = 'ai', eventType = null) {
        const messagesEl = document.getElementById('messages')
        const messageDiv = document.createElement('div')
        messageDiv.className = `message message-${type}`

        if (eventType === 'thinking') {
          const thinkingEl = document.createElement('div')
          thinkingEl.className = 'message-thinking'
          thinkingEl.dataset.rawText = content || ''
          thinkingEl.textContent = `💭 ${content || ''}`
          messageDiv.appendChild(thinkingEl)
        } else if (eventType === 'plan') {
          const plan = typeof content === 'string' ? JSON.parse(content) : content
          let planHtml = '<div class="message-plan"><h4>📋 执行计划</h4><ul>'
          if (Array.isArray(plan.plan)) {
            plan.plan.forEach((item, index) => {
              planHtml += `<li>${index + 1}. ${item.task || item}</li>`
            })
          }
          planHtml += '</ul></div>'
          messageDiv.innerHTML = planHtml
        } else if (eventType === 'worker') {
          const worker = typeof content === 'string' ? JSON.parse(content) : content
          messageDiv.innerHTML = `<div class="message-worker"><strong>🔧 Worker ${worker.taskId || ''}:</strong> ${worker.status || ''} ${worker.content ? '- ' + worker.content : ''}</div>`
        } else if (eventType === 'synthesis') {
          messageDiv.innerHTML = `<div class="message-synthesis">🔗 综合结果: ${content}</div>`
        } else if (eventType === 'error') {
          const error = typeof content === 'string' ? JSON.parse(content) : content
          messageDiv.innerHTML = `<div class="message-error">❌ 错误: ${error.message || content}</div>`
        } else {
          const bubble = document.createElement('div')
          bubble.className = 'message-bubble'
          // ✅ FIX: 保存原始文本到 data 属性
          bubble.dataset.rawText = content
          // 渲染 Markdown
          bubble.innerHTML = renderMarkdown(content)
          // 高亮代码块
          if (typeof hljs !== 'undefined') {
            bubble.querySelectorAll('pre code').forEach((block) => {
              hljs.highlightElement(block)
            })
          }
          messageDiv.appendChild(bubble)
        }

        messagesEl.appendChild(messageDiv)
        messagesEl.scrollTop = messagesEl.scrollHeight
      }

      // 更新最后一条消息（用于流式输出）
      function updateLastMessage(content, eventType = 'content') {
        const messagesEl = document.getElementById('messages')
        let lastMessage = messagesEl.lastElementChild

        if (!lastMessage || !lastMessage.classList.contains('message-ai')) {
          addMessage('', 'ai', eventType)
          lastMessage = messagesEl.lastElementChild
        }

        if (eventType === 'content') {
          let bubble = lastMessage.querySelector('.message-bubble')
          if (!bubble) {
            bubble = document.createElement('div')
            bubble.className = 'message-bubble'
            lastMessage.appendChild(bubble)
          }
          // ✅ FIX: 保存原始文本到 data 属性，以便后续累加
          bubble.dataset.rawText = content
          // 渲染 Markdown
          bubble.innerHTML = renderMarkdown(content)
          // 高亮代码块
          if (typeof hljs !== 'undefined') {
            // 清除之前的高亮，重新高亮所有代码块
            bubble.querySelectorAll('pre code').forEach((block) => {
              hljs.highlightElement(block)
            })
          }
        } else if (eventType === 'thinking') {
          let thinkingEl = lastMessage.querySelector('.message-thinking')
          if (!thinkingEl) {
            thinkingEl = document.createElement('div')
            thinkingEl.className = 'message-thinking'
            lastMessage.insertBefore(thinkingEl, lastMessage.firstChild)
          }
          // ✅ FIX: 累加 thinking 内容，而不是替换
          const currentText = thinkingEl.dataset.rawText || ''
          const newText = currentText + (content || '')
          thinkingEl.dataset.rawText = newText
          thinkingEl.textContent = `💭 ${newText}`
        }

        messagesEl.scrollTop = messagesEl.scrollHeight
      }

      // 发送消息
      async function sendMessage() {
        const inputEl = document.getElementById('messageInput')
        const sendButton = document.getElementById('sendButton')
        const message = inputEl.value.trim()

        if (!message || isStreaming) {
          return
        }

        // 检查连接
        if (!(await checkConnection())) {
          alert('无法连接到服务器，请检查服务器是否运行')
          return
        }

        // 禁用输入
        inputEl.disabled = true
        sendButton.disabled = true
        isStreaming = true

        // 显示用户消息
        addMessage(message, 'user')

        // 清空输入框
        inputEl.value = ''

        // 获取配置
        const serverUrl = document.getElementById('serverUrl').value
        const mode = document.getElementById('mode').value
        const thinkingEnabled = document.getElementById('thinkingEnabled').checked
        const mcpEnabled = document.getElementById('mcpEnabled').checked

        // 准备请求数据
        const requestData = {
          message: message,
          sessionId: currentSessionId,
          thinkingEnabled: thinkingEnabled,
          mcpEnabled: mcpEnabled,
          mode: mode,
        }

        // 更新状态
        const statusEl = document.getElementById('status')
        statusEl.textContent = '正在发送消息...'
        statusEl.className = 'status loading'

        try {
          // 使用 fetch 发送 POST 请求并处理 SSE 流
          const response = await fetch(`${serverUrl}/api/chat`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(requestData),
          })

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`)
          }

          // 处理 SSE 流
          const reader = response.body.getReader()
          const decoder = new TextDecoder()
          let buffer = ''
          let currentEvent = { type: null, data: null }

          while (true) {
            const { done, value } = await reader.read()

            if (done) {
              break
            }

            buffer += decoder.decode(value, { stream: true })
            const lines = buffer.split('\n')
            buffer = lines.pop() || ''

            for (const line of lines) {
              if (line.startsWith('event: ')) {
                currentEvent.type = line.substring(7).trim()
                console.log('解析到事件类型:', currentEvent.type) // 调试日志
              } else if (line.startsWith('data: ')) {
                try {
                  const data = JSON.parse(line.substring(6))
                  currentEvent.data = data
                  console.log('解析到事件数据:', data) // 调试日志

                  // 当遇到空行时，处理完整的事件
                  if (currentEvent.type && currentEvent.data) {
                    handleSSEEvent({
                      type: currentEvent.type,
                      data: currentEvent.data,
                    })
                    currentEvent = { type: null, data: null }
                  }
                } catch (e) {
                  console.error('解析 SSE 数据失败:', e, line)
                }
              } else if (line.trim() === '') {
                // 空行表示事件结束
                if (currentEvent.type && currentEvent.data) {
                  handleSSEEvent({
                    type: currentEvent.type,
                    data: currentEvent.data,
                  })
                  currentEvent = { type: null, data: null }
                }
              }
            }
          }

          // 处理剩余的 buffer
          if (buffer.trim()) {
            const lines = buffer.split('\n')
            for (const line of lines) {
              if (line.startsWith('event: ')) {
                currentEvent.type = line.substring(7).trim()
              } else if (line.startsWith('data: ')) {
                try {
                  const data = JSON.parse(line.substring(6))
                  currentEvent.data = data
                  if (currentEvent.type && currentEvent.data) {
                    handleSSEEvent({
                      type: currentEvent.type,
                      data: currentEvent.data,
                    })
                    currentEvent = { type: null, data: null }
                  }
                } catch (e) {
                  console.error('解析 SSE 数据失败:', e, line)
                }
              } else if (line.trim() === '') {
                // 空行表示事件结束
                if (currentEvent.type && currentEvent.data) {
                  handleSSEEvent({
                    type: currentEvent.type,
                    data: currentEvent.data,
                  })
                  currentEvent = { type: null, data: null }
                }
              }
            }
          }

          statusEl.textContent = '已连接到服务器'
          statusEl.className = 'status connected'
        } catch (error) {
          console.error('发送消息失败:', error)
          addMessage(`发送失败: ${error.message}`, 'ai', 'error')
          statusEl.textContent = `错误: ${error.message}`
          statusEl.className = 'status disconnected'
        } finally {
          // 恢复输入
          inputEl.disabled = false
          sendButton.disabled = false
          isStreaming = false
          inputEl.focus()
        }
      }

      // 处理 SSE 事件
      function handleSSEEvent(event) {
        const { type, data } = event
        console.log('收到 SSE 事件:', type, data) // 调试日志

        switch (type) {
          case 'session':
            // 保存会话 ID
            if (data.sessionId) {
              currentSessionId = data.sessionId
              updateSessionInfo()
            }
            break
          case 'thinking':
            updateLastMessage(data.text, 'thinking')
            break
          case 'content':
            // ✅ FIX: 累加内容片段，然后重新渲染 Markdown
            const lastBubble = document.querySelector('.message-ai:last-child .message-bubble')
            // 获取当前文本内容（从已渲染的 HTML 中提取，或使用原始文本）
            // 注意：我们需要保存原始文本，因为 innerHTML 是渲染后的 HTML
            let currentText = ''
            if (lastBubble) {
              // 尝试从 data 属性获取原始文本，如果没有则从 textContent 获取（可能不准确）
              currentText = lastBubble.dataset.rawText || lastBubble.textContent || ''
            }
            const newText = data.text || ''
            const newContent = currentText + newText
            // 更新并重新渲染 Markdown
            updateLastMessage(newContent, 'content')
            break
          case 'plan':
            addMessage(data, 'ai', 'plan')
            break
          case 'worker':
            addMessage(data, 'ai', 'worker')
            break
          case 'synthesis':
            addMessage(data.text || JSON.stringify(data), 'ai', 'synthesis')
            break
          case 'tool_call':
            // ✅ 新增：显示工具调用
            const toolCallText = `🔧 **调用工具**: \`${data.toolName || 'unknown'}\`\n`
            updateLastMessage(toolCallText, 'content')
            break
          case 'tool_result':
            // ✅ 新增：显示工具执行结果
            const toolResultText = `✅ **工具执行完成**: \`${data.toolName || 'unknown'}\`\n\`\`\`\n${typeof data.result === 'string' ? data.result : JSON.stringify(data.result, null, 2)}\n\`\`\`\n\n`
            updateLastMessage(toolResultText, 'content')
            break
          case 'error':
            addMessage(data, 'ai', 'error')
            break
          case 'done':
            // 完成事件，可以在这里处理最终答案
            if (data.finalAnswer) {
              updateLastMessage(data.finalAnswer, 'content')
            }
            break
          default:
            console.log('未知事件类型:', type, data)
        }
      }

      // 回车发送
      document.getElementById('messageInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          sendMessage()
        }
      })

      // 更新会话信息显示
      function updateSessionInfo() {
        const sessionInfoEl = document.getElementById('sessionInfo')
        if (currentSessionId) {
          sessionInfoEl.textContent = `会话 ID: ${currentSessionId.substring(0, 8)}...`
        } else {
          sessionInfoEl.textContent = '新会话将在首次发送消息时创建'
        }
      }

      updateSessionInfo()

      // 配置 Marked.js
      if (typeof marked !== 'undefined') {
        marked.setOptions({
          breaks: true, // 支持 GitHub 风格的换行
          gfm: true, // 启用 GitHub 风格的 Markdown
          highlight: function (code, lang) {
            if (lang && typeof hljs !== 'undefined') {
              try {
                return hljs.highlight(code, { language: lang }).value
              } catch (err) {
                return hljs.highlightAuto(code).value
              }
            }
            return code
          },
        })
      }

      // Markdown 渲染函数
      function renderMarkdown(text) {
        if (typeof marked !== 'undefined') {
          return marked.parse(text)
        }
        // 如果没有 marked 库，返回转义的 HTML
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>')
      }
    </script>
  </body>
</html>
