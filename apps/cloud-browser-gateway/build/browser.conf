[program:browser]
environment=HOME="/home/neko",USER="neko",DISPLAY=":99.0",PULSE_SERVER="unix:/tmp/pulseaudio.socket",XDG_RUNTIME_DIR="/tmp/runtime-neko"
command=/opt/roxychrome/RoxyChrome --user-data-dir=/home/neko/.config/RoxyChrome --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --no-first-run --no-default-browser-check --disable-infobars --window-size=1920,1080 --window-position=0,0
autorestart=true
priority=900
user=neko
stdout_logfile=/var/log/neko/browser.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true