# user buqiyuan;
worker_processes auto;

events {
    worker_connections 10240;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    lua_package_path "/usr/local/openresty/lualib/?.lua;;";

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

	server {
    listen 80;
    server_name _;

    root /var/github/roxy-browser/apps/cloud-browser-user/dist;
    index index.html;

    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;

    # 1. gateway
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. websocket
    location = /ws {
        set $target_port "";

        access_by_lua_block {
            local session_id = ngx.var.arg_password
            if not session_id or session_id == "" then
                ngx.exit(400)
            end

            local redis = require "resty.redis"
            local red = redis:new()
            red:set_timeout(1000)

            local ok = red:connect("127.0.0.1", 6379)
            if not ok then
                ngx.exit(502)
            end

            local port = red:get("session_port:" .. session_id)
            if not port or port == ngx.null then
                ngx.exit(404)
            end

            ngx.var.target_port = tostring(port)
            red:set_keepalive(10000, 100)
        }

        proxy_pass http://127.0.0.1:$target_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 3. 前端
    location / {
        try_files $uri $uri/ /index.html;
    }
}
}
