<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoxyBrowser Oauth</title>
  </head>
  <script>
    const channel = new BroadcastChannel('oauth2:callback')

    // 其他窗口发送消息过来时，说明授权完成了，可以关闭这个窗口了
    channel.onmessage = (event) => {
      console.log('channel.onmessage oauth2:callback', event)
      const { data } = event
      if (data === 'close') {
        window.close()
      }
    }

    channel.postMessage(location.search)

    // 如果 500ms 后没有收到其他窗口的消息，说明其他窗口没有正确处理授权回调或者关闭了其他窗口
    setTimeout(() => {
      location.replace(`/login?oauth2callback=${encodeURIComponent(location.search)}`)
    }, 500)
  </script>
  <body></body>
</html>
