services:
  neko: 
    image: buqiyuan/roxychrome145:latest
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    shm_size: 2g
    ports:
      - "8080:8080"
      - "52000-52100:52000-52100/udp"
    environment:
      NEKO_DESKTOP_SCREEN: 1920x1080@30
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: neko
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: admin
      NEKO_WEBRTC_EPR: 52000-52100
      NEKO_WEBRTC_ICELITE: 1
      NEKO_NAT1TO1: 192.168.10.8
      NEKO_DESKTOP_COMMAND: "/opt/roxychrome/RoxyChrome --user-data-dir=/home/neko/.config/RoxyChrome --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --no-first-run --no-default-browser-check --disable-infobars --window-size=1920,1080 --window-position=0,0"
    volumes:
      - ./profile:/home/neko/.config/RoxyChrome
      - ./supervisord/browser.conf:/etc/neko/supervisord/browser.conf
