packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  '@larksuiteoapi/node-sdk': 1.70.0
  '@modelcontextprotocol/sdk': ^1.3.0
  axios: ^1.19.0
  dompurify: ^3.3.1
  highlight.js: ^11.11.1
  marked: ^17.0.1
  typescript: ^7.0.2
  unplugin-dts: 1.0.3
  vite: 8.2.0
  webpack: 5.105.4
  webpack-cli: 7.0.3

catalogMode: manual

cleanupUnusedCatalogs: true

onlyBuiltDependencies:
  - electron

packageExtensions:
  element-plus:
    dependencies:
      # element-plus 源码直接 import '@vue/shared'，但未写入自身 dependencies
      '@vue/shared': '*'

overrides:
  '@electron/node-gyp': npm:node-gyp@^11.5.0

patchedDependencies:
  '@larksuiteoapi/node-sdk@1.70.0': patches/@larksuiteoapi__node-sdk@1.70.0.patch

peerDependencyRules:
  allowedVersions: {}

shellEmulator: true

supportedArchitectures:
  cpu: [current, x64, arm64, ia32]
  os: [current, darwin]

trustPolicy: no-downgrade
